<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPA SHOP - Google Lens Web OCR</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Tesseract.js CDN untuk ekstraksi teks (OCR) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8" x-data="lensApp()">

    <div class="max-w-2xl mx-auto">
        <!-- Header -->
        <div class="mb-6 text-center">
            <h1 class="text-2xl font-bold text-teal-700">WPA SHOP - Lens OCR</h1>
            <p class="text-sm text-slate-500">Upload Foto / Screenshot & Salin Teks Otomatis</p>
        </div>

        <!-- Card Utama -->
        <div class="bg-white rounded-2xl shadow-md p-6 border border-slate-100 space-y-6">
            
            <!-- Area Upload Foto -->
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-2 uppercase tracking-wider">1. Pilih atau Upload Foto</label>
                <div class="border-2 border-dashed border-teal-300 rounded-2xl p-6 text-center bg-teal-50/50 hover:bg-teal-50 transition cursor-pointer relative">
                    <input type="file" accept="image/*" @change="handleImageUpload($event)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
                    <div class="flex flex-col items-center justify-center space-y-2">
                        <span class="text-3xl">📁</span>
                        <p class="text-sm font-semibold text-teal-800">Ketuk untuk memilih foto atau screenshot</p>
                        <p class="text-xs text-slate-400">Mendukung format JPG, PNG, WEBP</p>
                    </div>
                </div>
            </div>

            <!-- Preview Gambar yang Diupload -->
            <div x-show="imagePreview" class="text-center">
                <p class="text-xs font-bold text-slate-600 mb-2 uppercase tracking-wider">Pratinjau Gambar</p>
                <img :src="imagePreview" class="max-h-48 mx-auto rounded-xl border border-slate-200 shadow-sm object-contain">
            </div>

            <!-- Status Loading -->
            <div x-show="isProcessing" class="text-center py-4">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-teal-600 border-t-transparent"></div>
                <p class="text-xs text-teal-700 font-medium mt-2 animate-pulse">🔍 Sedang memindai teks dari gambar (Google Lens Style)...</p>
            </div>

            <!-- Hasil Teks & Tombol Salin -->
            <div x-show="extractedText !== ''" class="space-y-3">
                <div class="flex justify-between items-center">
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider">2. Hasil Teks Terdeteksi</label>
                    <button @click="copyToClipboard()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs font-semibold px-4 py-2 rounded-xl transition shadow flex items-center gap-1.5">
                        📋 <span x-text="copyBtnText">Salin Teks</span>
                    </button>
                </div>
                
                <textarea x-model="extractedText" rows="6" class="w-full text-sm p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-teal-500 outline-none font-mono text-slate-700"></textarea>
            </div>

        </div>
    </div>

    <!-- Script Logika -->
    <script>
        function lensApp() {
            return {
                imagePreview: null,
                extractedText: '',
                isProcessing: false,
                copyBtnText: 'Salin Teks',

                async handleImageUpload(event) {
                    const file = event.target.files[0];
                    if (!file) return;

                    // Tampilkan pratinjau gambar
                    this.imagePreview = URL.createObjectURL(file);
                    this.isProcessing = true;
                    this.extractedText = '';

                    try {
                        // Proses OCR (Membaca teks dari gambar menggunakan Tesseract.js)
                        const result = await Tesseract.recognize(
                            file,
                            'ind+eng', // Mendukung Bahasa Indonesia dan Inggris
                            { logger: m => console.log(m) }
                        );

                        this.extractedText = result.data.text.trim();
                        if (!this.extractedText) {
                            this.extractedText = '(Tidak ada teks yang berhasil dideteksi pada gambar ini)';
                        }
                    } catch (error) {
                        console.error(error);
                        alert('Gagal memproses gambar. Pastikan file valid.');
                    } finally {
                        this.isProcessing = false;
                    }
                },

                copyToClipboard() {
                    if (!this.extractedText) return;
                    navigator.clipboard.writeText(this.extractedText).then(() => {
                        this.copyBtnText = '✅ Berhasil Disalin!';
                        setTimeout(() => {
                            this.copyBtnText = 'Salin Teks';
                        }, 2000);
                    });
                }
            }
        }
    </script>
</body>
</html>
